{% extends "base.html" %}
{% block title %}Sign in — Company Screening Assistant{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="lead">This demo is protected so that strangers cannot spend its API budget.
  Enter the access token you were given.</p>

{% if error %}
<div class="errors" role="alert"><p>{{ error }}</p></div>
{% endif %}

<form method="post" action="/login" class="screen-form">
  <label for="token">Access token</label>
  <input id="token" name="token" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
